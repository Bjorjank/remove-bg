name: Real AI model inference proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'evidence/**'

permissions:
  contents: write

jobs:
  real-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual rembg and CPU inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rembg[cpu]==2.0.74' 'pillow>=10,<13'
      - name: Run real lightweight ONNX model on synthetic product image
        env:
          U2NET_HOME: ${{ runner.temp }}/rembg-models
        run: |
          python tools/verify_real_model_evidence.py
      - name: Confirm real inference output and evidence provenance
        run: |
          python - <<'PY'
          import json, pathlib
          from PIL import Image
          p=pathlib.Path('evidence')
          d=json.loads((p/'real-inference-summary.json').read_text())
          assert d['status']=='PASS'
          assert d['stage']=='REAL_MODEL_INFERENCE'
          assert d['model']=='u2netp'
          assert d['model_session_type']=='REAL rembg session; ONNX Runtime'
          assert d['input']=='synthetic PNG drawn with Pillow; not a customer photo'
          assert d['alpha_min_max'][0]<255 and d['alpha_min_max'][1]>0
          for f in ['real-inference-before.png','real-inference-after.png','real-inference-comparison.png']:
            with Image.open(p/f) as img:
              img.verify()
          print('REAL_INFERENCE_EVIDENCE=PASS')
          PY
      - name: Upload evidence as immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-rembg-u2netp-inference
          path: |
            evidence/real-inference-before.png
            evidence/real-inference-after.png
            evidence/real-inference-comparison.png
            evidence/real-inference-summary.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish generated real-inference output to public source repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/real-inference-*.png evidence/real-inference-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: real rembg u2netp segmentation on synthetic image [skip ci]'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo 'Retrying after concurrent evidence publication'
            sleep 4
          done
          exit 1
